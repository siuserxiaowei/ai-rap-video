[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airap"
version = "0.1.0"
description = "Industrial Autonomous AI Rap Video Generation Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0"
]

[project.scripts]
airap = "airap.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
